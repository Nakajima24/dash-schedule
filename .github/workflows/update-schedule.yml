name: Update class schedule feed

# Runs on the first day of every month at 09:00 UTC, and on demand from
# the Actions tab. Commits the JSON files only when something changed.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # ~340 pages; through the headless-browser fallback a run can take
    # a while, but nowhere near this ceiling.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Cloudflare blocks by TLS fingerprint and IP reputation.
        # curl_cffi (Chrome TLS impersonation) is tried first; from
        # GitHub's datacenter IPs that can still be 403'd, so the
        # scraper falls back to real headless Chromium via Playwright,
        # which passes Cloudflare's browser challenge.
        run: |
          pip install curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Scrape schedule
        run: python scrape_schedule.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain -- '*.json')" ]]; then
            git config user.name  "dash-schedule-bot"
            git config user.email "actions@github.com"
            git add ./*.json
            git commit -m "Monthly class schedule refresh"
            git push
          else
            echo "No changes."
          fi
